<!doctype html><html><head><style>body{margin:0;background:#152126;color:white;font:13px sans-serif}canvas{display:block}#labels{position:absolute;inset:0;pointer-events:none}.label{position:absolute;background:#000b;padding:3px;border:1px solid #ddd;border-radius:3px;font-size:11px}</style></head><body><div id="labels"></div><script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const r=new THREE.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);document.body.appendChild(r.domElement);const s=new THREE.Scene();s.background=new THREE.Color('#25353e');const c=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.001,100);const orbit=new OrbitControls(c,r.domElement);s.add(new THREE.HemisphereLight(0xffffff,0x666666,2));const light=new THREE.DirectionalLight(0xffffff,3);light.position.set(1,3,3);s.add(light);
const gltf=await new GLTFLoader().loadAsync('/models/'+(new URLSearchParams(location.search).get('model')||'machines/lathe/lathe.glb'));s.add(gltf.scene);gltf.scene.updateMatrixWorld(true);const original=new Map();gltf.scene.traverse(n=>{if(n.isMesh){if(!n.geometry.attributes.normal)n.geometry.computeVertexNormals();if(!gltf.parser.json.materials)n.material=new THREE.MeshStandardMaterial({color:0x94aca5,metalness:.2,roughness:.65});original.set(n,n.material);}});let labels=[];
window.view=(names=[],eye=[2,1.3,3],isolate=false)=>{gltf.scene.traverse(n=>{if(n.isMesh){n.visible=!isolate||names.includes(n.name);n.material=names.includes(n.name)?new THREE.MeshStandardMaterial({color:0xffb75e,metalness:.15,roughness:.5}):original.get(n);}});const b=new THREE.Box3();for(const name of names)b.union(new THREE.Box3().setFromObject(gltf.scene.getObjectByName(name)));if(b.isEmpty())b.setFromObject(gltf.scene);const center=b.getCenter(new THREE.Vector3()),size=b.getSize(new THREE.Vector3()).length();c.position.copy(center).add(new THREE.Vector3(...eye).normalize().multiplyScalar(size*1.8));orbit.target.copy(center);orbit.update();document.querySelector('#labels').innerHTML='';labels=names.map(name=>{const el=document.createElement('div');el.className='label';el.textContent=name;document.querySelector('#labels').append(el);return {el,obj:gltf.scene.getObjectByName(name)}});};window.view([],[-2,1.2,3]);window.ready=true;
r.setAnimationLoop(()=>{orbit.update();r.render(s,c);for(const {el,obj}of labels){const p=new THREE.Box3().setFromObject(obj).getCenter(new THREE.Vector3()).project(c);el.style.left=((p.x+1)*innerWidth/2)+'px';el.style.top=((1-p.y)*innerHeight/2)+'px';}});
</script></body></html>
