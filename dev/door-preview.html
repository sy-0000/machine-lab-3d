<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>拱形防爆鋼門預覽（Unity 用）</title>
<style>html,body{margin:0;height:100%;background:#1c1714;font-family:system-ui,"Noto Sans TC",sans-serif;color:#f1e6cf;overflow:hidden}
#ui{position:fixed;left:12px;top:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;z-index:2}
button{background:#5a3f22;color:#fff;border:1px solid #c9a05a;border-radius:6px;padding:8px 14px;font-size:15px;cursor:pointer}
button.on{background:#c9a05a;color:#1c1714}#note{position:fixed;left:12px;bottom:10px;font-size:13px;opacity:.8;max-width:720px}</style></head>
<body><div id="ui"><button id="open">▶ 開門</button><button id="close">◀ 關門</button><button id="vest" class="on">玄關</button><button id="shop">工作室出口</button></div>
<div id="note">拖曳旋轉、滾輪縮放。幾何與 Unity 的 ArchedBlastDoor.cs 相同（同一組尺寸、零件與開門時間軸）；材質與燈光是近似。</div>
<script type="module" src="./doorPreview.js"></script></body></html>
