<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>車床是怎麼切削的？｜繪本風車削動畫</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F7F0E1; --ink:#4B3A30; --muted:#8A7565;
  --panel:#FFFBF2; --btn:#FFF6E6; --btn-on:#F29E4C; --btn-on-ink:#FFFBF2;
  --blob1:#E6F0E2; --blob2:#FCE6D2;
  --rot:#3D7CC9; --feed:#E35D4F; --rapid:#A0928A;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#2B2622; --ink:#F1E6D4; --muted:#BBA894;
    --panel:#352F2A; --btn:#3E3731; --btn-on:#F29E4C; --btn-on-ink:#2B2622;
    --blob1:#33392F; --blob2:#3F332B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#2B2622; --ink:#F1E6D4; --muted:#BBA894;
  --panel:#352F2A; --btn:#3E3731; --btn-on:#F29E4C; --btn-on-ink:#2B2622;
  --blob1:#33392F; --blob2:#3F332B;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  height:100%;margin:0;overflow:hidden;background:var(--paper);color:var(--ink);
  font-family:"LXGW WenKai TC","Kaiti TC","DFKai-SB","PingFang TC","Microsoft JhengHei",serif;
}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

.page{
  position:fixed;left:50%;transform:translateX(-50%);
  top:calc(env(safe-area-inset-top,0px) + 14px);
  width:min(720px, calc(100vw - 28px));
  background:var(--panel);border:2px solid var(--ink);border-radius:16px;
  box-shadow:5px 5px 0 rgba(75,58,48,.16);
  padding:12px 18px 12px;
}
.page .meta{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:14px;color:var(--muted);margin:0 0 4px}
.page h1{font-size:14px;font-weight:400;margin:0;color:var(--muted)}
.page h2{font-size:23px;font-weight:700;margin:0 0 4px;line-height:1.3}
.desc{font-size:17px;line-height:1.7;margin:0;min-height:3.4em}

.bar{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
  width:min(720px, calc(100vw - 28px));
  background:var(--panel);border:2px solid var(--ink);border-radius:16px;
  box-shadow:5px 5px 0 rgba(75,58,48,.16);
  padding:10px 14px 12px;display:flex;flex-direction:column;gap:10px;
}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spacer{flex:1}
button{
  font:inherit;font-size:15px;color:var(--ink);background:var(--btn);
  border:2px solid var(--ink);border-radius:999px;padding:4px 14px;cursor:pointer;
  box-shadow:2px 2px 0 rgba(75,58,48,.18);
}
button:active{transform:translate(1px,1px);box-shadow:1px 1px 0 rgba(75,58,48,.18)}
button:focus-visible{outline:3px solid var(--rot);outline-offset:2px}
button[aria-pressed="true"]{background:var(--btn-on);color:var(--btn-on-ink)}
#play{min-width:76px;font-weight:700}
.speed{display:flex;align-items:center;gap:5px}
.speed span{font-size:14px;color:var(--muted);margin-right:2px}
.speed button{padding:3px 10px;font-size:14px}
.track{display:flex;gap:4px;height:14px}
.seg{
  flex-grow:var(--w);flex-basis:0;position:relative;overflow:hidden;padding:0;
  border:2px solid var(--ink);border-radius:999px;background:var(--btn);box-shadow:none;cursor:pointer;
}
.seg .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--muted)}
.seg.cut .fill{background:var(--feed)}
.seg:active{transform:none}

@media (max-width:560px){
  .page{padding:10px 13px}
  .page h2{font-size:19px}
  .desc{font-size:15px;min-height:0}
  button{font-size:14px;padding:3px 11px}
}

/* ---- 預覽模式（?preview）：放在網站首頁的機台卡片裡，滑鼠停在卡片上時播放 ---- */
html.preview .bar{display:none}
html.preview .page{
  left:14px;top:50%;transform:translateY(-50%);
  width:min(36%, 330px);padding:12px 16px;box-shadow:3px 3px 0 rgba(75,58,48,.16);
}
html.preview .page h2{font-size:19px}
html.preview .desc{font-size:14px;line-height:1.65;min-height:0}
@media (max-width:640px){
  html.preview .page{top:auto;bottom:10px;left:10px;right:10px;width:auto;transform:none;padding:8px 12px}
  html.preview .page h2{font-size:16px;margin:0}
  html.preview .desc{display:none}
}
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>

<section class="page" id="page" aria-live="polite">
  <div class="meta"><h1>車床是怎麼切削的？</h1><span id="step">第 1 頁 / 11</span></div>
  <h2 id="stageName">主軸啟動</h2>
  <p class="desc" id="stageDesc"></p>
</section>

<div class="bar" id="bar" role="group" aria-label="播放控制">
  <div class="row">
    <button id="play" type="button">暫停</button>
    <button id="restart" type="button">從頭看</button>
    <span class="spacer"></span>
    <div class="speed" role="group" aria-label="播放速度">
      <span>速度</span>
      <button type="button" data-speed="0.25" aria-pressed="false">0.25×</button>
      <button type="button" data-speed="0.5" aria-pressed="false">0.5×</button>
      <button type="button" data-speed="1" aria-pressed="true">1×</button>
      <button type="button" data-speed="2" aria-pressed="false">2×</button>
    </div>
  </div>
  <div class="track" id="track"></div>
</div>

<script type="module">
import { createAnimation } from './lathe.anim.js';
(function(){
  "use strict";

  // 預覽模式：網站首頁卡片用 <iframe src="…?preview"> 嵌入，由外層用 postMessage 控制播放
  const params = new URLSearchParams(location.search);
  const PREVIEW = params.has('preview');
  if (PREVIEW) document.documentElement.classList.add('preview');
  if (params.get('theme') === 'dark' || params.get('theme') === 'light') document.documentElement.dataset.theme = params.get('theme');

  // 尺寸、分段與繪圖都在 lathe.anim.js（VR 大門口的螢幕也用同一份）
  const anim = createAnimation(document.getElementById('c').getContext('2d'));
  const { stages, TOTAL, VIEW } = anim, THEME = anim.theme;
  const clamp01 = v => Math.max(0, Math.min(1, v));

  /* ---------- 介面 ---------- */
  const $ = id => document.getElementById(id);
  const stepEl = $('step'), nameEl = $('stageName'), descEl = $('stageDesc'), playBtn = $('play');
  const segFills = stages.map((s, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'seg' + (s.type === 'feed' ? ' cut' : '');
    b.style.setProperty('--w', s.dur);
    b.setAttribute('aria-label', '翻到第 ' + (i + 1) + ' 頁：' + s.name);
    b.title = s.name;
    const f = document.createElement('span'); f.className = 'fill'; b.appendChild(f);
    b.addEventListener('click', () => seek(s.start));
    $('track').appendChild(b);
    return f;
  });

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let simTime = 0, speed = PREVIEW ? 1.25 : 1, playing = !reduceMotion && !PREVIEW, lastStage = -1;

  function updatePlayLabel(){ playBtn.textContent = simTime >= TOTAL ? '再看一次' : (playing ? '暫停' : '播放'); }
  function seek(t){ simTime = Math.max(0, Math.min(TOTAL, t)); anim.clearChips(); updatePlayLabel(); }
  playBtn.addEventListener('click', () => {
    if (simTime >= TOTAL){ seek(0); playing = true; } else playing = !playing;
    updatePlayLabel();
  });
  $('restart').addEventListener('click', () => { seek(0); playing = true; updatePlayLabel(); });
  document.querySelectorAll('[data-speed]').forEach(b => b.addEventListener('click', () => {
    speed = parseFloat(b.dataset.speed);
    document.querySelectorAll('[data-speed]').forEach(o => o.setAttribute('aria-pressed', String(o === b)));
  }));
  window.addEventListener('keydown', e => {
    if (e.code === 'Space' && !(e.target instanceof HTMLButtonElement)){ e.preventDefault(); playBtn.click(); }
  });

  /* ---------- 畫布與版面 ---------- */
  const cv = $('c');
  let dpr = 1, S = 50, OX = 0, OY = 0, CW = 0, CH = 0;
  function readTheme(){
    const cs = getComputedStyle(document.documentElement);
    ['--paper','--ink','--blob1','--blob2','--rot','--feed','--rapid'].forEach(k => { THEME[k] = cs.getPropertyValue(k).trim(); });
  }
  function layout(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    CW = window.innerWidth; CH = window.innerHeight;
    cv.width = Math.round(CW * dpr); cv.height = Math.round(CH * dpr);
    if (PREVIEW){
      // 說明面板在左側（窄的時候在下方）。機台只畫在面板右邊（CLIP_X），從畫面外滑進來的東西不會跑到面板後面
      const pr = $('page').getBoundingClientRect(), side = CW > 640;
      CLIP_X = side ? Math.round(pr.right + 6) : 0;
      const x0 = CLIP_X + 6, x1 = CW - 12, y0 = 10, y1 = side ? CH - 10 : pr.top - 8;
      const pw = Math.max(80, x1 - x0), ph = Math.max(80, y1 - y0);
      S = Math.min(pw / (VIEW.x1 - VIEW.x0), ph / (VIEW.z1 - VIEW.z0));
      OX = (x0 + x1) / 2 - S * (VIEW.x0 + VIEW.x1) / 2;
      OY = (y0 + y1) / 2 - S * (VIEW.z0 + VIEW.z1) / 2;
      anim.layout({ dpr, width: CW, height: CH, clipX: CLIP_X, S, OX, OY });
      return;
    }
    const top = $('page').getBoundingClientRect().bottom + 16;
    const bottom = $('bar').getBoundingClientRect().top - 12;
    const rw = CW - 32, rh = Math.max(120, bottom - top);
    S = Math.min(rw / (VIEW.x1 - VIEW.x0), rh / (VIEW.z1 - VIEW.z0));
    OX = CW / 2 - S * (VIEW.x0 + VIEW.x1) / 2;
    OY = top + rh / 2 - S * (VIEW.z0 + VIEW.z1) / 2;
    anim.layout({ dpr, width: CW, height: CH, clipX: CLIP_X, S, OX, OY });
  }
  window.addEventListener('resize', layout);
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { readTheme(); });
  new MutationObserver(readTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  /* ---------- 主迴圈 ---------- */
  let last = performance.now();
  function frame(now){
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    const sdt = playing ? dt * speed : 0;
    if (playing){
      simTime += sdt;
      if (simTime >= TOTAL){
        simTime = TOTAL;
        if (PREVIEW){ holdEnd += dt; if (holdEnd > 1.6){ holdEnd = 0; seek(0); } }  // 預覽：停一下再從頭循環
        else { playing = false; updatePlayLabel(); }
      }
    }
    const st = anim.drawFrame(simTime, sdt, playing), s = stages[st.k];

    if (st.k !== lastStage){
      lastStage = st.k;
      stepEl.textContent = '第 ' + (st.k + 1) + ' 頁 / ' + stages.length;
      nameEl.textContent = s.name;
      descEl.textContent = s.desc;
    }
    for (let i = 0; i < stages.length; i++){
      segFills[i].style.width = (clamp01((simTime - stages[i].start) / stages[i].dur) * 100).toFixed(1) + '%';
    }
    if (!PREVIEW || active) requestAnimationFrame(frame); else looping = false;
  }

  // 預覽：外層送來 play / pause / theme。暫停時整個繪製迴圈停下，不佔效能
  let active = !PREVIEW, looping = true, holdEnd = 0, CLIP_X = 0;
  if (PREVIEW) window.addEventListener('message', e => {
    if (e.source !== window.parent || e.origin !== location.origin || !e.data) return;
    if (e.data.type === 'play'){
      seek(0); holdEnd = 0; playing = !reduceMotion; active = true;
      if (!looping){ looping = true; last = performance.now(); requestAnimationFrame(frame); }
    } else if (e.data.type === 'pause'){
      playing = false; active = false;
    } else if (e.data.type === 'theme'){
      document.documentElement.dataset.theme = e.data.theme;
      readTheme();
      if (!looping){ looping = true; requestAnimationFrame(frame); }  // 重畫一格新配色
    }
  });

  readTheme();
  layout();
  updatePlayLabel();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
